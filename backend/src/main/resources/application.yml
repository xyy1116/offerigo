server:
  port: 8080
  # 浏览器调试/代理偶尔会带上较大的请求头，默认 8KB 容易触发 "Request header is too large"
  max-http-request-header-size: 64KB

spring:
  profiles:
    active: local
  application:
    name: chuan-backend
  datasource:
    url: jdbc:mysql://localhost:3306/chuan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chuan.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J；默认 INFO 级别不打印。需要排查时把 mapper 包日志级别调到 DEBUG 即可。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（生产环境请务必修改 secret 并通过环境变量注入）
jwt:
  secret: "${JWT_SECRET:}"
  expiration: 86400000   # 令牌有效期，单位毫秒（默认24小时）
  remember-expiration: 604800000   # 记住我令牌有效期，单位毫秒（默认7天）
  header: Authorization
  token-prefix: "Bearer "

# WebSocket 允许的前端 Origin（逗号分隔；局域网访问需通过环境变量加入实际地址）
websocket:
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# 大模型配置（通过环境变量 DEEPSEEK_API_KEY / DASHSCOPE_API_KEY 注入）
llm:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: "${DEEPSEEK_API_KEY:}"
    model: deepseek-chat
  qwen-vl:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: "${DASHSCOPE_API_KEY:}"
    model: qwen3-vl-plus
  qwen-chat:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    # 均衡对话模型：在「音字同步（先合成音频再一体下发）」框架下换取更快的回复生成，
    # 显著降低「停止说话 → 生成回复」的延迟；若需最高质量可改回 qwen-max
    model: qwen-plus
  paraformer:
    ws-url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
    api-key: ${DASHSCOPE_API_KEY:}
    model: paraformer-realtime-v2
    # 识别语种提示，逗号分隔；中英混合（code-switching）已同时启用中英文
    language-hints: zh,en
    # 专业术语热词表 ID（在百炼控制台「热词」创建后填入），空则不启用。
    # 岗位/行业专有名词提权是提升识别准确率最有效的手段，建议配置。
    vocabulary-id: ""
    # 过滤语气词（嗯/啊等）
    disfluency-removal-enabled: true
    # VAD 断句静音阈值（ms）：即时响应档——用户停止说话约 0.8 秒即断句触发回复。
    # multi_threshold_mode_enabled=true 会对长句自适应延长断句阈值，兼顾响应速度与识别准确率；
    # 与前端 MicRecorder 的 endSilenceMs 保持统一。
    max-sentence-silence: 800
    # 防止 VAD 把长句切碎
    multi-threshold-mode-enabled: true
    # 开启心跳，持续静音时保持连接
    heartbeat: true
    # 语义标点：为识别文本自动补句读，提升中英混合句子可读性
    semantic-punctuation-enabled: true
    # 标点预测
    punctuation-prediction-enabled: true
    # 逆文本正则化：数字/单位口语化表达转为规范文本
    inverse-text-normalization-enabled: true

  # 简历-岗位向量匹配：调用百炼 OpenAI 兼容 /embeddings 接口
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: text-embedding-v3
    # 为空时复用 llm.qwen-chat.api-key（同一个百炼账号）
    api-key: ${DASHSCOPE_API_KEY:}

# 岗位爬虫：每天 08:00 从智联招聘、腾讯招聘、字节跳动抓取国内岗位。
# 三个来源的 source_url 都直接指向具体岗位页，不需要登录。
job-crawl:
  cron: "0 0 8 * * ?"
  max-candidates: 30